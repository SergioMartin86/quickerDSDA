name: Build and Run Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Create build directory
      run: mkdir build
    - name: Updating apt
      run: sudo apt-get update
    - name: Installing apt packages
      run: sudo apt install libgtest-dev gcovr libnuma-dev libtbb-dev libsdl2-dev libsdl2-image-dev libvorbis-dev
    - name: Installing meson and ninja
      run: python3 -m pip install meson ninja
    - name: Run meson configuration
      run: meson setup build -DonlyFree=true
    - name: Building project
      run: ninja -C build
    - name: Running tests
      # Serial test execution: pTester/tTester are multi-threaded, so meson's default
      # parallel test run oversubscribes a 2-core CI runner and the engine's per-thread
      # sched_getcpu indexing collides and crashes. One multi-threaded test at a time.
      run: meson test -C build --num-processes 1
    - uses: actions/upload-artifact@v4
      with:
        name: meson-logs
        path: build/meson-logs/
        